# The static tree. Hierarchical, outside the feed, no taxonomy.

name = 'page'
schema = 'WebPage'
hierarchical = true
views = ['full', 'teaser']
taxonomies = []

[fields]
  required = ['title']
  optional = ['summary', 'weight', 'components', 'services', 'sideMenu', 'menu']

[media]
  required = false
  profile = 'lead'
