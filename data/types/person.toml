# A person on an organisation site. Carries the seam to their own brand site.

name = 'person'
schema = 'Person'
hierarchical = false
views = ['full', 'teaser', 'card']
taxonomies = []

[fields]
  required = ['title']
  # personalSite is the shared contract with the Spectrum theme. Absolute,
  # https, host lowercased, trailing slash — exactly their Hugo baseURL.
  optional = ['role', 'personalSite', 'email', 'phone', 'credentials', 'weight']

[media]
  required = false
  aspect = '1:1'
  max = 1
  profile = 'portrait'
