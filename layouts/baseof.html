<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">{{ T "skipToContent" | default "Skip to content" }}</a>
  <header class="site-header">
    <div class="shell site-header__inner">
      {{ partial "header.html" . }}
    </div>
  </header>
  <main class="site-main" id="main">
    <div class="shell">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="shell">
      {{ partial "footer.html" . }}
    </div>
  </footer>
</body>
</html>
