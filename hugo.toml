# Every root-level key must stay ABOVE the first [table] header. TOML scopes
# bare keys to the most recent table, so a root setting written below one is
# silently swallowed as an unknown key of that table — no error, no warning.

baseURL = 'https://example.org/'
locale = 'en-US'
title = 'Meridian Field Services'

# Unset, Hugo uses the build machine's zone and the same commit renders
# different times on a laptop and in CI.
timeZone = 'America/Chicago'

# Documents are checked against their own revision date: if the file changed
# after `revised`, the standard moved without anyone being told. Needs GitInfo.
enableGitInfo = true

# The theme ships layouts/robots.txt, which refuses indexing outside production.
enableRobotsTXT = true

# Dates come from front matter and nowhere else. Hugo otherwise falls back
# through publishdate, lastmod and modified, and what those resolve to depends
# on the checkout rather than on the content.
[frontmatter]
  date = ['date']

# The trunk: what every branch shares. See CONTENT-MODEL.md.
[params]
  # SAMPLE CONTENT. Meridian Field Services does not exist. The county names are
  # real because the fixture is worthless if it is not plausible; everything else
  # — the company, the people, the jobs, the prices — is invented, and telephone
  # numbers use the 555 reservation.
  #
  # There are deliberately no testimonials, case studies or ratings anywhere in
  # this demo. A model with a type whose purpose is customer-verified proof cannot
  # ship invented examples of it; that is a fabricated review with a neutral
  # filename on it. The business with none is the one worth showing anyway.
  sampleContent = true
  description = 'Mechanical, plumbing and water systems for the Driftless region.'
  style = 'default'
  reader = 'Someone in the Driftless region with a building problem they did not choose to have.'
  voice = 'Plain, specific, unhurried. States what was done and what it cost.'
  views = ['full', 'teaser']

  # The default next action. Every page inherits one; the fallback is the thing
  # that still works when the integration does not.
  [params.action]
    label = 'Call (608) 555-0117'
    url = 'tel:+16085550117'

  [params.media]
    required = false
    profile = 'lead'

  # One organisation node, referenced by everything else.
  [params.schema]
    type = 'ProfessionalService'
    name = 'Meridian Field Services'
    sameAs = []

# Intent has dimensions; one bag cannot carry them. See CONTENT-MODEL.md.
[taxonomies]
  tag = 'tags'
  audience = 'audience'          # who the customer is
  response = 'response'          # how fast, and when
  service-area = 'service-areas' # where it is offered

[menus]
  [[menus.main]]
    name = 'Services'
    pageRef = '/services'
    weight = 10

  [[menus.main]]
    name = 'Commercial'
    pageRef = '/commercial'
    weight = 15

  [[menus.main]]
    name = 'Notes'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 30

  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 40

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
