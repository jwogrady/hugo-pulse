baseURL = 'https://example.org/'
locale = 'en-US'
title = 'Meridian Field Services'

# Dates come from front matter and nowhere else. Hugo otherwise falls back
# through publishdate, lastmod and modified, and what those resolve to depends
# on the checkout rather than on the content.
[frontmatter]
  date = ['date']

# Unset, Hugo uses the build machine's zone and the same commit renders
# different times on a laptop and in CI.
timeZone = 'America/Chicago'

# The trunk: what every branch shares. See CONTENT-MODEL.md.
[params]
  description = 'Mechanical, plumbing and water systems for the Driftless region.'
  style = 'default'
  voice = 'Plain, specific, unhurried. States what was done and what it cost.'
  views = ['full', 'teaser']

  [params.media]
    required = false
    profile = 'lead'

  # One organisation node, referenced by everything else.
  [params.schema]
    type = 'ProfessionalService'
    name = 'Meridian Field Services'
    sameAs = []

# Intent has dimensions; one bag cannot carry them. See CONTENT-MODEL.md.
[taxonomies]
  tag = 'tags'
  audience = 'audience'          # who the customer is
  response = 'response'          # how fast, and when
  service-area = 'service-areas' # where it is offered

[menus]
  [[menus.main]]
    name = 'Services'
    pageRef = '/services'
    weight = 10

  [[menus.main]]
    name = 'Commercial'
    pageRef = '/commercial'
    weight = 15

  [[menus.main]]
    name = 'Notes'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 30

  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 40

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
